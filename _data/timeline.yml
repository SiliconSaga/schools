# Timeline entries for /ledger/timeline. Newest-first ordering is done by the page.
# basis: record (district or vendor document), statement (said in writing or at a public
# meeting by the district, the Board, or the union), press (reported by a named news outlet),
# ledger (filed or sent by the keeper of this ledger, published in full).
# Add an entry only when its quote has been read in the linked source; see _research/.

- date: 2022-01-13
  basis: record
  title: "District signs a master staffing agreement with EduStaff for substitute staff"
  summary: >-
    The Business Administrator signed a "Supplemental Staffing Services Master Agreement" with EDUStaff, LLC of Grand Rapids, Michigan, effective January 13, 2022 and running "until June 30, 2024 unless terminated earlier", extendable by "a simple extension addendum". Exhibit A covers substitute teachers and "all other supplied staff"; Exhibit B prices "Classroom-Based Substitute Staff" at "30.00% of Staff Gross Payroll" and school nurses at 33%. EduStaff "shall invoice Client bi-weekly", itemized "in the form of a 'PDF' document for auditing and an 'Excel' document", and dispatches through "the AESOP (Dispatch) system". Either party may end it on sixty days' notice. The "EduStaff Pricing Schedule Addendum-Exhibit B" the Board approved on July 21, 2026 shares its name with this agreement's pricing exhibit; whether it amends this agreement or a later one is not stated in the minutes. The copy here was released by the district on July 16, 2025 in answer to another resident's records request made through OPRAmachine.
  sources:
    - label: "Master Agreement with Exhibits A and B, 13 pages"
      url: "/ledger/opra/files/edustaff-master-agreement-2022-01-13.pdf"

- date: 2025-07-16
  basis: record
  title: "District releases the EduStaff agreement seven business days after a records request"
  summary: >-
    Answering a resident's OPRA request for "a true copy of your 2022 contract with Edustaff", received July 7, 2025, the Business Administrator wrote that "the seven business day deadline to respond to your request is July 16, 2025. As such, the District is timely responding", and enclosed the agreement. The request and response were made through OPRAmachine, where they are public.
  sources:
    - label: "Response letter, July 16, 2025"
      url: "/ledger/opra/files/opra-response-2025-07-16-edustaff-agreement.pdf"
    - label: "OPRAmachine: West Orange Board of Education"
      url: "https://opramachine.com/body/west_orange_board_of_education"

- date: 2026-04-29
  basis: record
  title: "Proposals due for substitute and paraprofessional staffing"
  summary: >-
    Sealed proposals under Competitive Contracting Request for Proposals CC 25-09, "Substitute Staffing and Paraprofessional Services", were due at 10:00 a.m.
  sources:
    - label: "RFP CC 25-09 legal advertisement"
      url: "https://resources.finalsite.net/images/v1777051223/woboeorg/es0iktco079oat5c8giu/UPDATED-RFP-CC25-09-SubstituteStaffingandParaprofessionalServices1.pdf"

- date: 2026-04-29
  basis: statement
  title: "Superintendent's letter: $3 million in savings, \"the same familiar faces\""
  summary: >-
    In a letter to the community, the Superintendent wrote that outsourcing paraprofessional services "is a substantial $3 million savings that will reoccur year after year", that "our students will continue to see the same familiar faces they rely on", and that "there will be no rotation of paras as most paras are IEP driven." The letter puts the budget shortfall at $13.5 million.
  sources:
    - label: "Community budget letter, April 29, 2026, pp. 3-4"
      url: "https://resources.finalsite.net/images/v1777488819/woboeorg/biirh6zs6kbwvcamc67c/WestOrangeCommunityBudgetDetails4292026English.pdf"

- date: 2026-05-04
  basis: press
  title: "Board adopts the 2026-27 budget"
  summary: >-
    Patch reported that the Board of Education "unanimously voted to approve the district's 2026-2027 budget", a $206,821,351 budget with "a 2.5 percent increase to the school portion of a local homeowner's property taxes", and that "the spending plan includes 77 staff cuts, in addition to outsourcing some services such as paraprofessionals."
  sources:
    - label: "Patch, May 5, 2026"
      url: "https://patch.com/new-jersey/westorange/west-orange-school-board-oks-budget-job-cuts-over-protests-teachers-union"

- date: 2026-06-16
  basis: record
  title: "Board approves union agreement permitting the outsourcing"
  summary: >-
    The Board approved "the Memorandum of Agreement with the West Orange Education Association permitting the outsourcing of the paraprofessionals pursuant to the terms contained in the Memorandum of Agreement." The agreement itself is an attachment that is not part of the posted minutes.
  sources:
    - label: "Minutes, June 16, 2026, p. 12, Personnel item 6"
      url: "https://resources.finalsite.net/images/v1784732860/woboeorg/jryunce7m2qtccixad76/June162026MINUTES.pdf"

- date: 2026-06-16
  basis: record
  title: "Board rejects the proposals it received for the staffing work"
  summary: >-
    At the same meeting the Board voted "to reject proposals received for the Competitive Contracting Request for Proposal CC 25-09 - Substitute Staffing and Paraprofessional Services." The minutes give no reason.
  sources:
    - label: "Minutes, June 16, 2026, p. 25, Finance item 29"
      url: "https://resources.finalsite.net/images/v1784732860/woboeorg/jryunce7m2qtccixad76/June162026MINUTES.pdf"

- date: 2026-07-21
  basis: record
  title: "Board approves a $12,000,000 EduStaff pricing addendum"
  summary: >-
    The Board approved "the EduStaff Pricing Schedule Addendum-Exhibit B for an estimated amount of $12,000,000", by a vote of 4-0 with one member absent, and a revised Memorandum of Agreement with the West Orange Education Association "permitting the outsourcing of the paraprofessionals". The minutes do not say what the addendum covers. Whether it covers paraprofessional staffing, and on what basis that work was awarded after the June rejection, is not stated in the posted minutes.
  sources:
    - label: "Minutes, July 21, 2026, p. 13, Finance item 21, and p. 6, Personnel item 3(i)"
      url: "https://resources.finalsite.net/images/v1787848637/woboeorg/aecbvgbymysfx09km6um/July212026-Minutes.pdf"

- date: 2026-08-24
  basis: record
  title: "Board approves Sunbelt Staffing for substitute staffing"
  summary: >-
    The Board approved a "Client Services Agreement between the West Orange Public School District and Sunbelt Staffing, LLC for providing substitute staffing services for the 2026-2027 school year."
  sources:
    - label: "Minutes, August 24, 2026, p. 12, item 20"
      url: "https://resources.finalsite.net/images/v1790700674/woboeorg/zv51wsqdw2coq5gaafqr/August242026-Minutes.pdf"

- date: 2026-09-09
  basis: statement
  title: "Superintendent announces a School Community Budget Council"
  summary: >-
    By letter, the Superintendent invited families to join "the Superintendent's School Community Budget Council", made up of "one representative and one alternate from each of our schools" and "key district personnel", with PTA leadership guiding who is selected. Its stated aim is "effective, long-term budgetary recommendations". The letter does not say what authority the council has.
  sources:
    - label: "Budget Council letter, September 9, 2026"
      url: "https://resources.finalsite.net/images/v1788968912/woboeorg/sinhfmapfmopkktif2tq/SchoolCommunityBudgetCounciltranslated992026.pdf"

- date: 2026-09-28
  basis: statement
  title: "District reports 176 of 244 paraprofessional positions filled"
  summary: >-
    At the Board meeting, the Director of Human Resources reported that 244 paraprofessional positions are needed for 2026-27 and that 176 paraprofessionals were working: 13 in grant-funded or pension positions, 47 returning, and 116 new. Another 44 candidates were being onboarded and 24 positions were vacant. She said the district had held 354 interviews since July and was working with EduStaff to bring staff on. The administrator in charge of special services said seven registered behavior technicians from outside agencies were in classrooms as short-term support, with eight more to come. These figures are taken from the recording's automatic captions.
  sources:
    - label: "Meeting recording, from 53:12"
      url: "https://www.youtube.com/watch?v=QcmkuVBK-Nc&t=3192s"

- date: 2026-10-14
  basis: record
  title: "Three public-records requests hand-delivered to the district"
  summary: >-
    The author of this site handed three requests under the Open Public Records Act to the custodian of records at the Board of Education's Business Office, each date-stamped "Received Oct 14 2026": for the paraprofessional staffing contract and billing (OPRA-001), for paraprofessional coverage records (OPRA-002), and for school schedules, teacher-absence coverage data, and any guidance on showing movies (OPRA-003). The seven-business-day response period runs to October 23, 2026. Each request's full text, log, and every response as it arrives are on its page.
  sources:
    - label: "OPRA-001 stamped receipt"
      url: "/ledger/opra/files/opra-001-receipt-2026-10-14.pdf"
    - label: "OPRA-002 stamped receipt"
      url: "/ledger/opra/files/opra-002-receipt-2026-10-14.pdf"
    - label: "OPRA-003 stamped receipt"
      url: "/ledger/opra/files/opra-003-receipt-2026-10-14.pdf"

- date: 2026-10-14
  basis: statement
  title: "Board negotiations committee writes to families about the teacher contract and longevity pay"
  summary: >-
    In an email to families, the Board's negotiations committee said the district "continues to fully uphold our contractual obligations to educators" while facing "a multi-million dollar deficit", that West Orange ranks "15th out of New Jersey's 590 districts in total salary compensation packages", and that longevity pay "is not widely provided to teachers working in other school districts across New Jersey". It described West Orange's longevity bonus as "currently the highest in the state with most of our eligible staff receiving roughly $10,000.00 or $12,000.00 in longevity bonuses annually", and asked "What will this teacher contract cost over time?" The email lists among the year's "painful adjustments" the "outsourced paraprofessional support". The district's own reappointment table from May shows a different picture of longevity amounts; see [What the District Said](/ledger/statements#longevity-pay).
  sources:
    - label: "Email as received, October 14, 2026"
      url: "/ledger/files/2026-10-14-boe-negotiations-committee-email.txt"

- date: 2026-10-14
  basis: statement
  title: "Union answers the Board's email and describes the Board's October 5 offer"
  summary: >-
    The West Orange Education Association told its members it "categorically" denied "the insulting accusation that WE are to blame for the financial failings of the Board of Education", answered the Board's "70%" figure with "On average, New Jersey districts spend over 80% of their budgets on salary and benefits", and announced a rally for Saturday, October 17. It reshared its October 5 account of the second fact-finding session, where it says the Board made "a REGRESSIVE offer" with three parts: "significantly less money than they budgeted", eliminating longevity "for all new hires", and freezing longevity "permanently". It dates the negotiation from March 2025, with impasse in January 2026, mediation in March 2026, fact-finding on August 3, and a hearing set for January 7, 2027, and says that at the March 2026 mediation "the Board made no mention of the plan to outsource paras". The Board's proposal itself is not public. The message is undated on its face; it refers to the Board's email as sent "today", so it is placed on October 14. It reached this site on October 15.
  sources:
    - label: "WOEA, Response to Message from the District, October 14, 2026 (copy)"
      url: "/ledger/files/2026-10-14-woea-response-to-the-board.txt"
    - label: "Original on the union's mailing-list service"
      url: "https://sendy.njeasites.net/w/ZRoavBnoUS117nJWbHGoGQ/TiFV892o763HdGuKixj9WcfsjQ/iDb6OYTlEzz3LbivcTEyHw"

- date: 2026-10-15
  basis: ledger
  title: "Reply to the negotiations committee: the ChatGPT links, and a standing offer"
  summary: >-
    The author of this site replied to the committee's email, forwarding it to the district's general contact address because it came from a no-reply address. The reply says that parents were "puzzled about the true meaning of this email", that at least one of them "caught the ' ?utm_source=chatgpt.com' in the URL for most the cited articles at the end of the email" (six of the eight reference links carry it; see the published copy of the email), and that the offer he has made in public comment at Board meetings, to help the district use "advanced tooling like AI", specifically "to use AI well and responsibly", still stands. The reply is published in full.
  sources:
    - label: "Reply as sent, October 15, 2026"
      url: "/ledger/files/2026-10-15-reply-to-boe-negotiations-committee.txt"
