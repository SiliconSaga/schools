<script>
  /* Applied before first paint so a saved "wide" choice does not flash narrow. The theme
     compresses HTML onto one line, so only block comments are safe in inline scripts. */
  try { if (localStorage.getItem("page-width") === "wide") { document.documentElement.setAttribute("data-width", "wide"); } } catch (e) {}
  try {
    if (localStorage.getItem("color-scheme") === "light") {
      var sheet = document.querySelector('link[rel="stylesheet"][href*="just-the-docs-"]');
      if (sheet) { sheet.setAttribute("href", "{{ '/assets/css/just-the-docs-light.css' | relative_url }}"); }
    }
  } catch (e) {}
</script>
